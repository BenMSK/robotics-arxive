<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robotics arXive</title>
<meta name="description" content="Robust SLAM and AI motion planning papers from ICRA, IROS, RSS and CoRL, explained in English and Korean from the DYROS point of view.">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="arXive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #F6F5F1; --card: #FFFFFF; --ink: #1C1D21; --muted: #6A6B73; --line: #E4E2DC;
  --accent: #2456D6; --accent-soft: #E7EDFC; --mine: #B4540A; --mine-soft: #FCEEDF;
  --lens: #F0F5EC; --lens-line: #5B8C3A; --code: #EFEDE7;
  --serif: "Iowan Old Style", "Apple Garamond", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --card: #1B1C20; --ink: #ECECEF; --muted: #9A9BA4; --line: #2C2D33;
    --accent: #7FA2FF; --accent-soft: #1F2A45; --mine: #F2A65A; --mine-soft: #3A2A18;
    --lens: #18241A; --lens-line: #8CC56A; --code: #24252B;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.bar { display: flex; align-items: center; gap: 10px; height: 52px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); font-size: 17px; }
.brand svg { width: 26px; height: 26px; border-radius: 7px; flex: none; }
.brand small { font-weight: 500; color: var(--muted); font-size: 12px; }
.lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: none; padding: 4px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
nav.tabs { display: flex; gap: 4px; padding-bottom: 8px; }
nav.tabs a { padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
nav.tabs a.on { background: var(--accent-soft); color: var(--accent); }

main { padding: 14px 0 calc(48px + env(safe-area-inset-bottom)); }
.search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); font-size: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 11px;
  font-size: 13px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.count { color: var(--muted); font-size: 13px; margin: 10px 2px 6px; }

.card { display: grid; grid-template-columns: 44px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin: 10px 0; color: var(--ink); }
.card:active { transform: scale(0.99); }
.yr { font: 700 15px/1.1 var(--sans); color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg);
  text-align: right; letter-spacing: 0.06em; border-right: 2px solid var(--line); padding-left: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.venue { font-weight: 700; color: var(--ink); }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--code); color: var(--muted); }
.badge.mine { background: var(--mine-soft); color: var(--mine); }
.badge.read { background: var(--accent-soft); color: var(--accent); }
.card h3 { margin: 4px 0 4px; font-size: 16px; line-height: 1.35; letter-spacing: -0.005em; }
.card p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; font-size: 12.5px; }
.tags a { color: var(--accent); }

.back { display: inline-block; margin: 2px 0 10px; font-size: 14px; font-weight: 600; }
.paper h1 { font: 700 24px/1.3 var(--serif); letter-spacing: -0.01em; margin: 8px 0 8px; }
.authors { font-size: 13.5px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.links a, .links button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px;
  font-size: 14px; font-weight: 600; color: var(--ink); }
.links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.links button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

article { font-size: 17px; line-height: 1.75; margin-top: 18px; overflow-wrap: break-word; }
article:lang(ko) { line-height: 1.85; word-break: keep-all; }
article h2 { font: 700 20px/1.35 var(--sans); margin: 34px 0 10px; letter-spacing: -0.01em; }
article p, article ul, article ol { margin: 0 0 14px; }
article ul, article ol { padding-left: 22px; }
article li { margin: 4px 0; }
article strong { font-weight: 700; }
article blockquote { margin: 0 0 18px; padding: 14px 16px; background: var(--accent-soft); border-radius: 12px; }
article blockquote p { margin: 0; }
article blockquote p + p { margin-top: 8px; }
article code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: 0.88em; }
article figure { margin: 18px -4px 22px; }
article figure img { width: 100%; height: auto; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
article figcaption { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
article table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 14px; margin: 0 0 16px; }
article th, article td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
article section.lens { background: var(--lens); border-left: 4px solid var(--lens-line); border-radius: 12px;
  padding: 2px 16px 4px; margin: 30px -4px 10px; }
article section.lens h2 { margin-top: 16px; color: var(--lens-line); }
article .muted { color: var(--muted); font-size: 13.5px; }
.note { font-size: 14px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }

.venues h2 { font-size: 18px; margin: 22px 0 6px; }
.v { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 8px 0; }
.v b { font-size: 15.5px; }
.v .when { font-size: 12.5px; color: var(--muted); }
.v p { margin: 4px 0 0; font-size: 14px; line-height: 1.55; }
footer { color: var(--muted); font-size: 12.5px; padding: 18px 0 8px; border-top: 1px solid var(--line); margin-top: 28px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#2456D6"/><rect x="16" y="11" width="32" height="42" rx="4" fill="#fff"/><path d="M22 44 C28 40, 26 30, 33 28 S 40 22, 42 18" stroke="#2456D6" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="22" cy="44" r="3.4" fill="#F2A65A"/><circle cx="42" cy="18" r="3.4" fill="#2456D6"/></svg>
        <span>Robotics arXive <small>DYROS</small></span>
      </a>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="ko">KR</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
const T = {
  en: { tab2026: '2026 papers', bible: 'Bible', venues: 'Venues', log: 'Log', addedOn: (d, n) => `${d} · ${n} papers added`, search: 'Search title, author, #tag…',
        all: 'All', full: 'Write-up', abs: 'Abstract only', mine: 'Mine', read: 'Read', papers: n => `${n} papers`,
        back: '← Back', markRead: 'Mark as read', isRead: '✓ Read', abstract: 'Abstract', original: 'Show original',
        absNote: 'The full text is not openly available (no arXiv version), so only the abstract is shown.',
        none: 'No papers match.', venuesTitle: 'What to follow', authorsMore: n => ` +${n} more`,
        cov: 'Coverage: ICRA 2026 full program (2,761 papers) · RSS 2026 (210) · CoRL 2026 (687 titles) · IROS 2026 papers tagged "IROS 2026" on arXiv (the official program is behind a bot check). Selected for robust SLAM, AI-applied motion planning and parking.' },
  ko: { tab2026: '2026 논문', bible: 'Bible', venues: '학회·저널', log: '기록', addedOn: (d, n) => `${d} · 논문 ${n}편 추가`, search: '제목, 저자, #tag 검색…',
        all: '전체', full: '해설', abs: 'Abstract만', mine: '내 논문', read: '읽음', papers: n => `논문 ${n}편`,
        back: '← 목록', markRead: '읽음 표시', isRead: '✓ 읽음', abstract: 'Abstract', original: '원문 보기',
        absNote: '본문이 공개되어 있지 않아(arXiv 버전 없음) abstract만 실었습니다.',
        none: '조건에 맞는 논문이 없습니다.', venuesTitle: '챙겨 볼 학회와 저널', authorsMore: n => ` 외 ${n}명`,
        cov: '수집 범위: ICRA 2026 전체 프로그램(2,761편) · RSS 2026(210편) · CoRL 2026(687편 제목) · IROS 2026은 arXiv에 "IROS 2026"으로 표기된 논문(공식 프로그램은 봇 차단). robust SLAM, AI 기반 motion planning, 주차와 관련된 논문을 골랐습니다.' },
};

// Venues to follow. "typical" months: check each year's call for papers.
const VENUES = [
  { g: 'core', n: 'ICRA', f: 'IEEE Int. Conf. on Robotics and Automation', when: { en: 'May–June · deadline ~mid-Sep', ko: '5–6월 · 마감 ~9월 중순' },
    why: { en: 'Largest robotics venue. Every SLAM and planning thread shows up here first; RA-L papers can be presented here.', ko: '가장 큰 로보틱스 학회입니다. SLAM과 planning의 거의 모든 흐름이 여기 먼저 나옵니다. RA-L 논문도 여기서 발표할 수 있습니다.' } },
  { g: 'core', n: 'IROS', f: 'IEEE/RSJ Int. Conf. on Intelligent Robots and Systems', when: { en: 'Sep–Oct · deadline ~Mar 1', ko: '9–10월 · 마감 ~3월 1일' },
    why: { en: 'Second big general venue; strong LiDAR/VIO odometry and field-robotics tracks. Your IROS 2023 paper lives here.', ko: '두 번째 대형 학회입니다. LiDAR/VIO odometry와 field robotics가 강합니다. IROS 2023 논문이 여기 있습니다.' } },
  { g: 'core', n: 'RSS', f: 'Robotics: Science and Systems', when: { en: 'July · deadline ~late Jan', ko: '7월 · 마감 ~1월 말' },
    why: { en: 'Small and selective (~210 papers). Fewer but deeper papers: certifiable estimation, planning theory, learning.', ko: '작고 까다로운 학회(약 210편)입니다. 수는 적지만 깊습니다: certifiable estimation, planning 이론, 학습.' } },
  { g: 'core', n: 'CoRL', f: 'Conference on Robot Learning', when: { en: 'Nov · deadline ~late Apr–May', ko: '11월 · 마감 ~4월 말–5월' },
    why: { en: 'Where learning meets robots: diffusion planners, end-to-end driving, VLA. Little classic SLAM.', ko: '학습과 로봇이 만나는 곳입니다: diffusion planner, end-to-end driving, VLA. 고전적 SLAM은 적습니다.' } },
  { g: 'av', n: 'IV', f: 'IEEE Intelligent Vehicles Symposium', when: { en: 'June · deadline ~Jan–Feb', ko: '6월 · 마감 ~1–2월' },
    why: { en: 'The parking and vehicle planning community (your IV 2023 Biased Target-tree* paper).', ko: '주차와 차량 planning 커뮤니티입니다 (IV 2023 Biased Target-tree* 논문).' } },
  { g: 'av', n: 'ITSC', f: 'IEEE Int. Conf. on Intelligent Transportation Systems', when: { en: 'Sep–Oct · deadline ~Mar–Apr', ko: '9–10월 · 마감 ~3–4월' },
    why: { en: 'Vehicle localization, AVP systems, V2X, traffic-aware planning (your ITSC 2019 paper).', ko: '차량 localization, AVP 시스템, V2X, 교통 상황을 고려한 planning (ITSC 2019 논문).' } },
  { g: 'vision', n: 'CVPR / ICCV / ECCV', f: 'Computer vision', when: { en: 'CVPR June (deadline ~Nov); ICCV odd years, ECCV even years (deadline ~Mar)', ko: 'CVPR 6월(마감 ~11월); ICCV 홀수 해, ECCV 짝수 해(마감 ~3월)' },
    why: { en: 'Feed-forward 3D (DUSt3R, VGGT), learned SLAM, end-to-end driving (UniAD) start here before robotics adopts them.', ko: 'Feed-forward 3D(DUSt3R, VGGT), 학습 기반 SLAM, end-to-end driving(UniAD)이 로보틱스보다 먼저 나오는 곳입니다.' } },
  { g: 'vision', n: '3DV', f: 'Int. Conf. on 3D Vision', when: { en: 'Spring · deadline ~Aug', ko: '봄 · 마감 ~8월' },
    why: { en: 'Registration, reconstruction, Gaussian splatting; smaller and SLAM-friendly.', ko: 'Registration, 3D 복원, Gaussian splatting. 작고 SLAM과 가깝습니다.' } },
  { g: 'ml', n: 'NeurIPS / ICLR / ICML', f: 'Machine learning', when: { en: 'NeurIPS Dec (deadline ~May); ICLR Apr–May (deadline ~Sep–Oct); ICML July (deadline ~Jan)', ko: 'NeurIPS 12월(마감 ~5월); ICLR 4–5월(마감 ~9–10월); ICML 7월(마감 ~1월)' },
    why: { en: 'Diffusion/flow planners (Diffuser, Diffusion Planner), world models and RL methods that later reach driving.', ko: 'Diffusion/flow planner(Diffuser, Diffusion Planner), world model, RL 기법이 나중에 driving으로 넘어옵니다.' } },
  { g: 'journal', n: 'T-RO', f: 'IEEE Transactions on Robotics', when: { en: 'Rolling', ko: '상시' },
    why: { en: 'Flagship journal: the definitive versions of SLAM systems (ORB-SLAM3, FAST-LIO2, X-ICP) and planners.', ko: '대표 저널입니다. SLAM 시스템(ORB-SLAM3, FAST-LIO2, X-ICP)과 planner의 완성판이 실립니다.' } },
  { g: 'journal', n: 'IJRR', f: 'Int. Journal of Robotics Research', when: { en: 'Rolling', ko: '상시' },
    why: { en: 'Long-form theory (RRT*, certifiable SLAM) and major datasets.', ko: '긴 이론 논문(RRT*, certifiable SLAM)과 주요 데이터셋이 실립니다.' } },
  { g: 'journal', n: 'RA-L', f: 'IEEE Robotics and Automation Letters', when: { en: 'Rolling · with ICRA/IROS presentation options', ko: '상시 · ICRA/IROS 발표 연계' },
    why: { en: 'Fast, short journal; most LiDAR/VIO odometry papers (KISS-ICP, GNC) appear here.', ko: '빠르고 짧은 저널입니다. LiDAR/VIO odometry 논문(KISS-ICP, GNC)이 많이 실립니다.' } },
  { g: 'journal', n: 'T-ASE', f: 'IEEE Transactions on Automation Science and Engineering', when: { en: 'Rolling', ko: '상시' },
    why: { en: 'Your TargetTree-RRT* (2022) and narrow-space planner (2025). Applied planning and automation systems.', ko: 'TargetTree-RRT*(2022)와 좁은 공간 planner(2025)가 실린 곳입니다. 응용 planning과 자동화 시스템.' } },
  { g: 'journal', n: 'T-ITS / T-IV', f: 'IEEE Trans. on Intelligent Transportation Systems / Intelligent Vehicles', when: { en: 'Rolling', ko: '상시' },
    why: { en: 'Vehicle-specific planning, parking, localization; good homes for AVP system papers.', ko: '차량 특화 planning, 주차, localization. AVP 시스템 논문을 내기 좋은 곳입니다.' } },
  { g: 'journal', n: 'Field Robotics / JFR', f: 'Field robotics journals', when: { en: 'Rolling', ko: '상시' },
    why: { en: 'Robust SLAM in the wild: degeneracy, adverse weather, long-term field deployments.', ko: '현장의 robust SLAM: degeneracy, 악천후, 장기간 현장 운용.' } },
  { g: 'journal', n: 'Science Robotics', f: '', when: { en: 'Rolling', ko: '상시' },
    why: { en: 'Few papers, big ideas; worth a monthly skim.', ko: '논문은 적고 아이디어는 큽니다. 한 달에 한 번 훑어볼 만합니다.' } },
];
const VGROUP = { core: { en: 'Core robotics conferences', ko: '핵심 로보틱스 학회' }, av: { en: 'Intelligent vehicles', ko: '지능형 차량' },
  vision: { en: 'Vision (for SLAM and perception)', ko: 'Vision (SLAM과 인식)' }, ml: { en: 'Machine learning (for AI planning)', ko: '머신러닝 (AI planning)' },
  journal: { en: 'Journals', ko: '저널' } };

const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('arxive.' + k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem('arxive.' + k, JSON.stringify(v)); } catch {} } };
let lang = store.get('lang', (navigator.language || '').startsWith('ko') ? 'ko' : 'en');
let read = new Set(store.get('read', []));
let papers = [];
const state = { q: '', venue: '', tag: '', kind: '' };
const scrollMemo = {};
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setLang(l) {
  lang = l; store.set('lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  route();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

function tabs(active) {
  const t = T[lang];
  document.getElementById('tabs').innerHTML = [['#/', t.tab2026, 'list'], ['#/bible', t.bible, 'bible'], ['#/venues', t.venues, 'venues'], ['#/log', t.log, 'log']]
    .map(([h, label, k]) => `<a href="${h}" class="${k === active ? 'on' : ''}">${label}</a>`).join('');
}

function card(p) {
  const t = T[lang];
  return `<a class="card" href="#/p/${p.id}">
    <div class="yr">${p.year}</div>
    <div>
      <div class="meta"><span class="venue">${esc(p.venue)}</span>
        ${p.mine ? `<span class="badge mine">${t.mine}</span>` : ''}
        ${p.kind === 'abstract' ? `<span class="badge">${t.abs}</span>` : ''}
        ${read.has(p.id) ? `<span class="badge read">${t.read}</span>` : ''}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.tldr[lang] || p.tldr.en)}</p>
      <div class="tags">${p.tags.map(g => `<span>#${g}</span>`).join('')}</div>
    </div></a>`;
}

function list(track) {
  const t = T[lang];
  tabs(track === 'bible' ? 'bible' : 'list');
  const base = papers.filter(p => p.track === track);
  const q = state.q.toLowerCase().replace(/^#/, '');
  const shown = base.filter(p =>
    (!state.venue || p.venue === state.venue) && (!state.tag || p.tags.includes(state.tag)) &&
    (!state.kind || (state.kind === 'mine' ? p.mine : p.kind === state.kind)) &&
    (!q || [p.title, p.authors.join(' '), p.tags.join(' '), p.venue, p.tldr.en, p.tldr.ko].join(' ').toLowerCase().includes(q)));
  const venues = [...new Set(base.map(p => p.venue))].sort();
  const tagCount = {};
  base.forEach(p => p.tags.forEach(g => tagCount[g] = (tagCount[g] || 0) + 1));
  const tagList = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b));
  const chip = (key, val, label) => `<button class="chip" data-k="${key}" data-v="${esc(val)}" aria-pressed="${state[key] === val}">${esc(label)}</button>`;
  app.innerHTML = `
    <input class="search" type="search" placeholder="${t.search}" value="${esc(state.q)}" aria-label="Search">
    <div class="chips">${chip('kind', '', t.all)}${chip('kind', 'full', t.full)}${chip('kind', 'abstract', t.abs)}${base.some(p => p.mine) ? chip('kind', 'mine', t.mine) : ''}
      ${track === '2026' ? venues.map(v => chip('venue', v, v)).join('') : ''}</div>
    <div class="chips">${tagList.map(g => chip('tag', g, `#${g} ${tagCount[g]}`)).join('')}</div>
    <div class="count">${t.papers(shown.length)}</div>
    ${shown.map(card).join('') || `<div class="empty">${t.none}</div>`}
    <footer>${t.cov}</footer>`;
  const s = app.querySelector('.search');
  s.oninput = () => { state.q = s.value; list(track); const n = app.querySelector('.search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    state[k] = state[k] === v && v ? '' : v;
    if (k === 'venue' && !v) state.venue = '';
    list(track);
  });
}

function sections(article) {
  // group each h2 and what follows into a <section>, so the DYROS lens can be styled as one box
  const kids = [...article.childNodes];
  let sec = null;
  kids.forEach(n => {
    if (n.nodeName === 'H2') {
      sec = document.createElement('section');
      if (/DYROS/.test(n.textContent)) sec.className = 'lens';
      article.insertBefore(sec, n);
    }
    if (sec) sec.appendChild(n);
  });
}

async function detail(id) {
  const t = T[lang];
  const p = papers.find(x => x.id === id);
  tabs(p && p.track === 'bible' ? 'bible' : 'list');
  if (!p) { app.innerHTML = `<div class="empty">Not found.</div>`; return; }
  const L = p.links || {};
  const btn = (href, label, cls = '') => href ? `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${label}</a>` : '';
  const shownAuthors = p.authors.slice(0, 8).join(', ') + (p.authors.length > 8 ? t.authorsMore(p.authors.length - 8) : '');
  app.innerHTML = `<div class="paper">
    <a class="back" href="${p.track === 'bible' ? '#/bible' : '#/'}">${t.back}</a>
    <div class="meta"><span class="venue">${esc(p.venue)}</span><span class="badge">${p.year}</span>
      ${p.mine ? `<span class="badge mine">${t.mine}</span>` : ''}${p.kind === 'abstract' ? `<span class="badge">${t.abs}</span>` : ''}</div>
    <h1>${esc(p.title)}</h1>
    <div class="authors">${esc(shownAuthors)}</div>
    <div class="links">${btn(L.arxiv, 'arXiv', 'primary')}${btn(L.pdf, 'PDF')}${btn(L.official, lang === 'ko' ? '공식 페이지' : 'Official')}${btn(L.code, 'Code')}${btn(L.project, lang === 'ko' ? '프로젝트' : 'Project')}
      <button id="rd" aria-pressed="${read.has(p.id)}">${read.has(p.id) ? t.isRead : t.markRead}</button></div>
    <div class="tags">${p.tags.map(g => `<a href="#/tag/${p.track}/${g}">#${g}</a>`).join('')}</div>
    <article lang="${lang}" id="art"></article></div>`;
  document.getElementById('rd').onclick = e => {
    read.has(p.id) ? read.delete(p.id) : read.add(p.id);
    store.set('read', [...read]);
    e.target.setAttribute('aria-pressed', read.has(p.id));
    e.target.textContent = read.has(p.id) ? t.isRead : t.markRead;
  };
  const art = document.getElementById('art');
  window.scrollTo(0, 0);
  if (p.kind === 'abstract') {
    const ko = lang === 'ko' && p.abstract_ko;
    art.innerHTML = `<blockquote><p><strong>TL;DR</strong> ${esc(p.tldr[lang])}</p></blockquote>
      <h2>${t.abstract}</h2><p>${esc(ko ? p.abstract_ko : p.abstract)}</p>
      ${ko ? `<details><summary>${t.original}</summary><p>${esc(p.abstract)}</p></details>` : ''}
      <p class="note">${t.absNote}</p>`;
    return;
  }
  try {
    const res = await fetch(`papers/${p.id}/${lang}.md`);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    const r = new marked.Renderer();
    r.image = (href, title, text) => {
      const src = /^(https?:)?\/\//.test(href) ? href : `papers/${p.id}/${href}`;
      return `<figure><a href="${esc(src)}" target="_blank"><img src="${esc(src)}" alt="${esc(text)}" loading="lazy"></a><figcaption>${esc(text)}</figcaption></figure>`;
    };
    r.link = (href, title, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
    art.innerHTML = marked.parse(md, { renderer: r });
    // a figure alone in a paragraph: unwrap so <figure> is not inside <p>
    art.querySelectorAll('p > figure:only-child').forEach(f => f.parentElement.replaceWith(f));
    sections(art);
  } catch (e) {
    art.innerHTML = `<p class="note">Could not load the post (${esc(e.message)}).</p>`;
  }
}

function venues() {
  tabs('venues');
  const t = T[lang];
  app.innerHTML = `<div class="venues"><h1 style="font:700 22px/1.3 var(--serif);margin:6px 0 2px">${t.venuesTitle}</h1>` +
    Object.keys(VGROUP).map(g => `<h2>${VGROUP[g][lang]}</h2>` + VENUES.filter(v => v.g === g).map(v =>
      `<div class="v"><b>${esc(v.n)}</b> <span class="when">${esc(v.f)}</span><div class="when">${esc(v.when[lang])}</div><p>${esc(v.why[lang])}</p></div>`).join('')).join('') +
    `<footer>${lang === 'ko' ? '날짜는 예년 기준입니다. 매년 call for papers를 확인하세요.' : 'Months are typical; check each year\'s call for papers.'}</footer></div>`;
}

async function logView() {
  // hand-written notes (log.<lang>.md) + every paper grouped by its "added" date
  tabs('log');
  const t = T[lang];
  let md = '';
  try { const r = await fetch(`log.${lang}.md`); if (r.ok) md = await r.text(); } catch {}
  const byDate = {};
  papers.forEach(p => (byDate[p.added || '?'] ||= []).push(p));
  const lists = Object.keys(byDate).sort().reverse().map(d => `<h2>${t.addedOn(d, byDate[d].length)}</h2><ul>` +
    byDate[d].map(p => `<li><a href="#/p/${p.id}">${esc(p.title)}</a> <span class="muted">${esc(p.venue)}${p.kind === 'abstract' ? ' · ' + t.abs : ''}</span></li>`).join('') + '</ul>').join('');
  app.innerHTML = `<article lang="${lang}"><h1 style="font:700 22px/1.3 var(--serif);margin:6px 0 2px">${t.log}</h1>${marked.parse(md)}${lists}</article>`;
}

function route() {
  const h = location.hash.slice(1) || '/';
  let m;
  document.title = 'Robotics arXive';
  if ((m = h.match(/^\/p\/([\w.+-]+)/))) return detail(m[1]);
  if ((m = h.match(/^\/tag\/(\w+)\/(\w+)/))) { state.tag = m[2]; state.venue = ''; location.replace(m[1] === 'bible' ? '#/bible' : '#/'); return; }
  if (h.startsWith('/venues')) return venues();
  if (h.startsWith('/log')) return logView();
  const track = h.startsWith('/bible') ? 'bible' : '2026';
  list(track);
  requestAnimationFrame(() => window.scrollTo(0, scrollMemo[track] || 0));
}
addEventListener('scroll', () => { const h = location.hash; if (!h.includes('/p/') && !h.includes('/venues') && !h.includes('/log')) scrollMemo[h.includes('bible') ? 'bible' : '2026'] = scrollY; }, { passive: true });
addEventListener('hashchange', route);

fetch('papers.json').then(r => r.json()).then(d => { papers = d; setLang(lang); })
  .catch(() => { app.innerHTML = '<div class="empty">Could not load papers.json</div>'; });
</script>
</body>
</html>
